# Restates the generator's own signature as the binding's type, so it is not inferred.
id: authenticated-environment-http-request
language: TypeScript
files:
  - upstream-t3code/packages/client-runtime/src/state/environmentHttpAuth.ts
rule:
  pattern: |-
    const executeEnvironmentRequest = Effect.fnUntraced(function* <$$$TYPES>($INPUT: $INPUT_TYPE): Effect.fn.Return<$A, $E, $R> {
      $$$BODY
    })
fix: |-
  const executeEnvironmentRequest: <$$$TYPES>(
    $INPUT: $INPUT_TYPE,
  ) => Effect.Effect<$A, $E, $R> = Effect.fnUntraced(function* <$$$TYPES>($INPUT: $INPUT_TYPE): Effect.fn.Return<$A, $E, $R> {
    $$$BODY
  })
