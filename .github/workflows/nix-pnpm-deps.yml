name: nix pnpm dependency hash

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: nix-pnpm-dependency-hash-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: check pnpm dependency hash
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.3

      - name: install nix
        uses: cachix/install-nix-action@v31

      - id: update
        name: calculate pnpm dependency hash
        shell: bash
        run: |
          nix run github:Mic92/nix-update/cf68051e7b7e08de6c707484cdcd1a53feb48e05 -- \
            t3code-cli \
            --flake \
            --version=skip \
            --override-filename nix/package.nix \
            --build

          if git diff --quiet -- nix/package.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo 'The Nix pnpm dependency hash is stale. Apply this change to the pull request:'
              echo
              echo '```diff'
              git diff -- nix/package.nix
              echo '```'
            } > "$RUNNER_TEMP/nix-pnpm-dependency-hash.md"
          fi

      - name: post proposed hash change
        if: steps.update.outputs.changed == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: nix-pnpm-dependency-hash
          path: ${{ runner.temp }}/nix-pnpm-dependency-hash.md

      - name: remove resolved hash comment
        if: steps.update.outputs.changed == 'false'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: nix-pnpm-dependency-hash
          delete: true

      - name: fail on dependency hash drift
        if: steps.update.outputs.changed == 'true'
        run: |
          echo '::error::The Nix pnpm dependency hash is stale. Apply the change from the pull request comment.'
          exit 1
