name: check

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: nix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: cachix/install-nix-action@v31

      - name: check upstream source revision
        shell: bash
        run: |
          submodule_rev=$(git ls-tree HEAD upstream-t3code | awk '{ print $3 }')
          input_rev=$(nix flake metadata --json | jq -r '.locks.nodes."upstream-t3code".locked.rev')
          test "$submodule_rev" = "$input_rev"

      - name: build
        run: nix build

  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            command: pnpm lint -- --format github
          - name: format
            command: pnpm format:check
          - name: typecheck
            command: pnpm typecheck
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: checkout contracts submodule
        run: git submodule update --init --depth=1 upstream-t3code

      - uses: pnpm/action-setup@v6.0.8

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: run ${{ matrix.name }}
        run: ${{ matrix.command }}
