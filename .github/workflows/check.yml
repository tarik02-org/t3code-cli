name: check

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: nix (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: cachix/install-nix-action@v31

      - name: configure cache
        uses: cachix/cachix-action@v17
        with:
          name: tarik02-t3code-cli
          skipPush: true

      - name: build
        run: |
          nix build --no-link --print-out-paths --print-build-logs .#default \
            > "$RUNNER_TEMP/nix-package-paths"

      - name: smoke-test
        run: |
          t3code_cli="$(nix eval --raw .#default.outPath)"
          "$t3code_cli/bin/t3cli" --version

      # Only master builds publish. PR jobs never receive this token.
      - name: publish package closure
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHIX_AUTH_TOKEN"
          cachix push tarik02-t3code-cli < "$RUNNER_TEMP/nix-package-paths"

  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            command: pnpm lint -- --format github
          - name: format
            command: pnpm format:check
          - name: typecheck
            command: pnpm typecheck
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: checkout contracts submodule
        run: git submodule update --init --depth=1 upstream-t3code

      - uses: pnpm/action-setup@v6.0.8

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: run ${{ matrix.name }}
        run: ${{ matrix.command }}
